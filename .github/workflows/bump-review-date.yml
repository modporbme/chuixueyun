name: Bump review date

on:
  schedule:
    # 每天 16:00 UTC = 北京时间次日 00:00
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update 更新日期 in README
        env:
          TZ: Asia/Shanghai
        run: |
          set -euo pipefail
          TODAY="$(date +%F)"
          FILE="README.md"
          if [ ! -f "$FILE" ]; then
            echo "README.md not found"
            exit 1
          fi
          if ! grep -qE '更新日期：20[0-9]{2}-[0-9]{2}-[0-9]{2}' "$FILE"; then
            echo "date pattern not found"
            exit 1
          fi
          sed -i -E "s/更新日期：20[0-9]{2}-[0-9]{2}-[0-9]{2}/更新日期：${TODAY}/" "$FILE"
          echo "TODAY=${TODAY}" >> "$GITHUB_ENV"
          grep -n "更新日期" "$FILE" | head

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "date already current, skip commit"
            exit 0
          fi
          git commit -m "chore: bump 更新日期 to ${TODAY}"
          git push
